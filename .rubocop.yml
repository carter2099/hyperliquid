AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - 'scripts/**/*'  # Integration scripts: linted for Lint+Security only by `rake rubocop:scripts`
    - 'local/**/*'  # Exclude local test scripts
    - 'vendor/**/*'  # Exclude vendored gems (CI bundles here)

# Allow longer methods for complex logic
Metrics/MethodLength:
  Max: 50

# Allow higher complexity for response handling
Metrics/AbcSize:
  Max: 25

# Disable class length checks so rubocop doesn't complain that we implement all of Hyperliquid's endpoints
Metrics/ClassLength:
  Enabled: false

# Allow longer blocks in specs and gemspec - this is normal for tests and gem configs
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

# Exchange API methods (and multi-sig co-signer helpers that pass through to them) require many parameters
Metrics/ParameterLists:
  Exclude:
    - 'lib/hyperliquid/exchange.rb'
    - 'lib/hyperliquid/signing/multi_sig.rb'

# Empty blocks are intentional in specs (no-op callbacks for subscription tests)
Lint/EmptyBlock:
  Exclude:
    - 'spec/**/*'
